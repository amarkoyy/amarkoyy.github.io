<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vajon nektek sikerül?</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#1d1d1f;--muted:#6b6b72;--line:#333;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#111;--text:#f2f2f2;--muted:#a0a0a8;--line:#333;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:600px;text-align:center}
h1{font-size:1.6rem;margin:4px 0 8px}
.sub{font-size:1.15rem;margin:0 0 16px}
svg{width:100%;height:auto;display:block}
polygon{fill:#f5f5f5;stroke:var(--line);stroke-width:4;stroke-linejoin:round;cursor:pointer;transition:fill .2s}
polygon.err{stroke:#e5484d;stroke-width:8}
text{font-size:38px;fill:#222;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.hint{color:var(--muted);text-align:left;margin:18px 4px 10px}
.palette{display:flex;justify-content:center;gap:22px;margin:0 0 16px}
.sw{width:52px;height:52px;border-radius:50%;border:4px solid transparent;cursor:pointer;padding:0}
.sw.sel{border-color:var(--text);box-shadow:0 0 0 3px var(--card) inset}
.stats{display:flex;justify-content:space-between;font-size:1.1rem;margin:0 4px 12px}
#msg{min-height:3em;font-weight:600;margin:0 0 8px}
.bad{color:#e5484d}.ok{color:#2a9d4a}
button.re{width:100%;padding:13px;border-radius:16px;border:1px solid var(--muted);background:transparent;color:var(--text);font-size:1.05rem;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h1>Vajon nektek sikerül?</h1>
  <p class="sub">Színezzétek ki a térképet minél kevesebb színnel!</p>
  <svg viewBox="-6 -6 932 764" aria-label="Térkép">
    <polygon id="A" points="0,0 460,0 362,237 0,320"/>
    <polygon id="B" points="460,0 920,0 920,250 599,237 362,237"/>
    <polygon id="C" points="0,320 362,237 418,488 237,585 0,585"/>
    <polygon id="D" points="362,237 599,237 681,473 418,488"/>
    <polygon id="E" points="599,237 920,250 920,585 765,585 681,473"/>
    <polygon id="F" points="237,585 418,488 681,473 765,585 765,752 237,752"/>
    <polygon id="G" points="0,585 237,585 237,752 0,752"/>
    <polygon id="H" points="765,585 920,585 920,752 765,752"/>
    <text x="195" y="125">A</text>
    <text x="655" y="97">B</text>
    <text x="195" y="417">C</text>
    <text x="515" y="347">D</text>
    <text x="793" y="390">E</text>
    <text x="515" y="625">F</text>
    <text x="112" y="668">G</text>
    <text x="843" y="668">H</text>
  </svg>
  <p class="hint">Válassz színt, majd kattints egy területre!</p>
  <div class="palette" id="pal"></div>
  <div class="stats"><span>Felhasznált színek: <b id="cnt">0</b></span><span>Hibák: <b id="err">0</b></span></div>
  <p id="msg"></p>
  <button class="re" id="reset">↻ Újrakezdés</button>
</div>
<script>
var COLORS=["#e76f51","#e9c46a","#2a9d8f","#6495ed"];
var IDS=["A","B","C","D","E","F","G","H"];
var PAIRS=[["A","B"],["A","C"],["B","D"],["B","E"],["C","D"],["C","F"],["C","G"],["D","E"],["D","F"],["E","F"],["E","H"],["F","G"],["F","H"]];
var cur=1,state={};
var pal=document.getElementById("pal");
COLORS.forEach(function(c,i){
  var b=document.createElement("button");
  b.className="sw"+(i===cur?" sel":"");b.style.background=c;b.setAttribute("aria-label","Szín "+(i+1));
  b.onclick=function(){cur=i;[].forEach.call(pal.children,function(x,j){x.classList.toggle("sel",j===i)})};
  pal.appendChild(b);
});
IDS.forEach(function(id){
  state[id]=null;
  document.getElementById(id).addEventListener("click",function(){state[id]=cur;update()});
});
function update(){
  var used={},all=true,bad={},errs=0;
  IDS.forEach(function(k){
    var el=document.getElementById(k);
    el.style.fill=state[k]===null?"":COLORS[state[k]];
    el.classList.remove("err");
    if(state[k]===null)all=false;else used[state[k]]=1;
  });
  PAIRS.forEach(function(p){
    if(state[p[0]]!==null&&state[p[0]]===state[p[1]]){errs++;bad[p[0]]=1;bad[p[1]]=1}
  });
  Object.keys(bad).forEach(function(k){document.getElementById(k).classList.add("err")});
  var n=Object.keys(used).length;
  document.getElementById("cnt").textContent=n;
  document.getElementById("err").textContent=errs;
  var m=document.getElementById("msg");
  if(errs){m.className="bad";m.textContent="Szomszédos területek egyszínűek! (piros szegély)"}
  else if(all&&n<=3){m.className="ok";m.textContent="Tökéletes! Csak "+n+" színt használtál."}
  else if(all){m.className="ok";m.textContent="Kész, de megoldható kevesebb színnel is. Próbáld újra!"}
  else{m.className="";m.textContent=""}
}
document.getElementById("reset").onclick=function(){IDS.forEach(function(k){state[k]=null});update()};
</script>
</body>
</html>
